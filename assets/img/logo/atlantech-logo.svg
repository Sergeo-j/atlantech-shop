<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 580 140" width="580" height="140" role="img" aria-label="AtlanTech">
  <title>AtlanTech</title>

  <!-- ATL -->
  <text x="8" y="112"
        font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif"
        font-weight="900"
        font-size="108"
        fill="#ff8717"
        letter-spacing="-2">ATL</text>

  <!-- Orange icon (logo.png embedded as vector-safe image) -->
  <image x="212" y="8" width="118" height="118"
         href="data:image/png;base64,"
         preserveAspectRatio="xMidYMid meet"/>

  <!-- NTECH -->
  <text x="334" y="112"
        font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif"
        font-weight="900"
        font-size="108"
        fill="#ff8717"
        letter-spacing="-2">NTECH</text>

  <!-- Tagline -->
  <text x="290" y="134"
        font-family="Arial, sans-serif"
        font-size="11"
        fill="#666666"
