  <rect x="48" y="444" width="1004" height="40" rx="12" fill="#081B33"/>
  <text x="72" y="469" font-family="Arial" font-size="14" fill="#FFFFFF">Principe UX : moins d'etapes visibles, prix toujours clair, paiement rassurant, suivi de commande accessible en un tap.</text>
