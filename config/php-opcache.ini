; ============================================================================
; AtlanTech Shop — Configuration OPcache recommandée
; ============================================================================
; Copier ces lignes dans votre php.ini (WAMP : C:\wamp64\bin\php\phpX.X.X\php.ini)
; Redémarrer Apache après modification.
; ============================================================================

[opcache]
; Activer OPcache
opcache.enable=1
opcache.enable_cli=0

; Mémoire allouée aux bytecodes (128 MB est suffisant pour ce projet)
opcache.memory_consumption=128

; Mémoire pour les chaînes intégrées
opcache.interned_strings_buffer=16

; Nombre max de fichiers à mettre en cache
opcache.max_accelerated_files=4000

; Vérification des timestamps (0 en prod, 1 en dev)
; En prod, mettre à 0 et vider le cache manuellement après deploy
opcache.validate_timestamps=1
opcache.revalidate_freq=60

; Optimisations agressives (safe pour PHP 8.x)
opcache.optimization_level=0x7FFFBFFF

; Journalisation des erreurs
opcache.log_verbosity_level=1

; JIT (PHP 8.x) — activer en production pour gains 10-30%
opcache.jit=1255
opcache.jit_buffer_size=64M

; ============================================================================
; APCu — cache utilisateur (homepage, sessions)
; ============================================================================
; Installer via: pecl install apcu (puis redémarrer Apache)
; Ou WAMP : activer l'extension php_apcu.dll dans phpMyAdmin Extensions

[apcu]
apc.enabled=1
apc.shm_size=64M
apc.ttl=300
apc.enable_cli=0
